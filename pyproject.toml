[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chestxray"
version = "0.1.0"
description = "DenseNet-121 multi-label classifier for NIH ChestX-ray14, with Grad-CAM (TCC, academic prototype, not for clinical use)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rodrigo Fassarella" }]
# Minimum versions only, so that `pip install -e .` never replaces the torch build
# preinstalled on Colab/Kaggle. Exact versions for local use are in requirements.txt,
# and every run records the versions it actually used.
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=1.24",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "grad-cam>=1.5",
]

[project.optional-dependencies]
data = ["kaggle>=1.6,<1.7"]  # 1.7.x buffers the whole download in memory
app = ["gradio>=4.0"]
dev = ["pytest>=8.0"]
notebooks = ["notebook>=7.0", "nbconvert>=7.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (deselect with -m \"not slow\")",
]
